# Ricostruzione giornaliera del sito su Netlify: serve alle uscite programmate dei progetti
# (campo "Pubblica dal"): il giorno indicato il progetto compare senza toccare niente.
# Si attiva solo quando nei Secrets del repository c'e NETLIFY_BUILD_HOOK (Netlify > Build hooks).
name: Ricostruzione giornaliera
on:
  schedule:
    - cron: '0 4 * * *'   # ogni giorno alle 4 UTC (6 in Italia d'estate, 5 d'inverno)
  workflow_dispatch: {}
jobs:
  ricostruisci:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il build hook di Netlify
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "NETLIFY_BUILD_HOOK non impostato: niente da fare"; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"
